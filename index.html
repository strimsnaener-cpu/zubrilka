<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зубрилка</title>
<meta name="description" content="Карточки для учёбы с умным повторением: слова, даты, формулы. Бесплатно, без регистрации.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='6' y='12' width='52' height='40' rx='4' fill='%23fffdf6' stroke='%23d64545' stroke-width='3'/><path d='M14 26h36M14 34h36M14 42h24' stroke='%232b59c3' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: колонка колод слева, рабочий стол с карточкой справа. Светлая тема — бумага и чернила, тёмная — школьная доска. */
:root {
  --desk: #e9eef3; --paper: #fffdf6; --rule: #c9d7ea; --margin: #e06666;
  --ink: #1d2a44; --ink-soft: #5b6a86; --pen: #2b59c3; --line: #d5dde8;
  --ok: #1f9d55; --no: #d64545; --chip: #ffffff;
  --hand: "Caveat", "Comic Sans MS", cursive; --ui: "Manrope", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #17201c; --paper: #24332c; --rule: #2f4239; --margin: #c76b5b;
  --ink: #eef3ea; --ink-soft: #a7b8ab; --pen: #f3e48a; --line: #34483e; --ok: #6ee7a0; --no: #ff8f7a; --chip: #1d2923; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #17201c; --paper: #24332c; --rule: #2f4239; --margin: #c76b5b;
  --ink: #eef3ea; --ink-soft: #a7b8ab; --pen: #f3e48a; --line: #34483e; --ok: #6ee7a0; --no: #ff8f7a; --chip: #1d2923; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 16px/1.5 var(--ui); min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 14px; padding: 14px max(16px, env(safe-area-inset-left)); max-width: 1180px; margin: 0 auto; }
.brand { font: 700 34px/1 var(--hand); color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 10px; }
.brand svg { width: 38px; height: 38px; }
.streak { margin-left: auto; font-weight: 700; color: var(--ink-soft); font-size: 14px; }
.ibtn { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; }
.app { max-width: 1180px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: 290px 1fr; gap: 24px; }
aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 8px 0 10px; }
.deck { display: block; width: 100%; text-align: left; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.deck.on { border-color: var(--pen); box-shadow: inset 4px 0 0 var(--pen); }
.deck b { display: block; }
.deck small { color: var(--ink-soft); }
.bar { height: 6px; background: var(--rule); border-radius: 9px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.btn { border: 0; background: var(--pen); color: var(--paper); border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.btn.line { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ok { background: var(--ok); color: #fff; } .btn.no { background: var(--no); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .deck:focus-visible, .tab:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--ink-soft); }
.tab.on { background: var(--ink); color: var(--paper); }
.deck-title { font: 700 30px/1.1 var(--hand); margin: 0 auto 0 0; padding-right: 12px; }
/* карточка */
.stage { perspective: 1400px; max-width: 640px; margin: 0 auto; }
.card { position: relative; height: 330px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); cursor: pointer; }
.card.flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6px; background: var(--paper);
  background-image: linear-gradient(to right, transparent 54px, var(--margin) 54px, var(--margin) 56px, transparent 56px), repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px);
  box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 14px 30px -12px rgba(20,30,60,.35); display: grid; place-items: center; padding: 30px 30px 30px 76px; text-align: center; }
.face.back { transform: rotateY(180deg); }
.face .txt { font: 700 clamp(30px, 5vw, 46px)/1.15 var(--hand); color: var(--ink); overflow-wrap: anywhere; }
.face.back .txt { color: var(--pen); }
.face .hint { position: absolute; bottom: 12px; right: 16px; font-size: 13px; color: var(--ink-soft); }
.face .speak { position: absolute; top: 12px; right: 12px; border: 0; background: transparent; font-size: 20px; cursor: pointer; }
.under { display: flex; justify-content: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.meta { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 14px; }
.boxes { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.boxes span { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--chip); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.done { text-align: center; padding: 50px 10px; }
.done .big { font: 700 48px/1 var(--hand); margin-bottom: 8px; }
/* тест */
.q { font: 700 clamp(30px,5vw,44px)/1.2 var(--hand); text-align: center; margin: 10px 0 22px; overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 640px; margin: 0 auto; }
.opt { background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 16px; font: 700 24px/1.2 var(--hand); cursor: pointer; overflow-wrap: anywhere; }
.opt.good { border-color: var(--ok); color: var(--ok); } .opt.bad { border-color: var(--no); color: var(--no); }
/* редактор */
.panel { background: var(--chip); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.panel h3 { margin: 0 0 10px; font-size: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text], textarea { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.row input[type=text] { flex: 1 1 180px; width: auto; }
textarea { min-height: 120px; resize: vertical; }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 460px; overflow: auto; }
.li { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 10px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.li span { overflow-wrap: anywhere; min-width: 0; }
.li .lv { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.x { border: 0; background: transparent; cursor: pointer; color: var(--no); font-size: 18px; }
.note { color: var(--ink-soft); font-size: 14px; margin: 6px 0 0; }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-weight: 700; opacity: 0; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; }
footer { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 0 16px 30px; }
footer a { color: var(--ink-soft); }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  aside { order: 2; }
  .face { padding-left: 56px; background-image: linear-gradient(to right, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px), repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px); }
  .card { height: 260px; }
  .opts { grid-template-columns: 1fr; }
  .li { grid-template-columns: 1fr 1fr auto; } .li .lv { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="12" width="52" height="40" rx="4" fill="var(--paper)" stroke="var(--margin)" stroke-width="3"/><path d="M14 26h36M14 34h36M14 42h24" stroke="var(--pen)" stroke-width="3"/></svg>Зубрилка</a>
  <span class="streak" id="streak"></span>
  <button class="ibtn" id="theme" title="Сменить тему" aria-label="Сменить тему">◐</button>
</header>
<main class="app">
  <aside>
    <h2>Колоды</h2>
    <div id="decks"></div>
    <button class="btn line" id="newDeck" style="width:100%">+ Новая колода</button>
    <p class="note">Карточки хранятся в этом браузере. Повторяй каждый день: забытое вернётся завтра, выученное — через 2, 4, 8 и 16 дней.</p>
  </aside>
  <section>
    <div class="tabs"><h1 class="deck-title" id="title"></h1>
      <button class="tab" data-v="learn">Учить</button><button class="tab" data-v="quiz">Тест</button><button class="tab" data-v="edit">Карточки</button></div>
    <div id="view"></div>
  </section>
</main>
<footer>Зубрилка — бесплатно и без регистрации · <a href="https://strimsnaener-cpu.github.io/utilka/">Утилька</a> · <a href="https://strimsnaener-cpu.github.io/kopilka/">Копилка</a> · <a href="https://strimsnaener-cpu.github.io/orbita/">Орбита</a></footer>
<div class="toast" id="toast"></div>
<script>
(function () {
"use strict";
const DAY = 86400000, STEPS = [0, 1, 2, 4, 8, 16];
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const load = (k, d) => { try { const v = localStorage.getItem("zub:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem("zub:" + k, JSON.stringify(v)); } catch (e) {} };
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1700); };
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const mk = (name, lang, pairs) => ({ id: Math.random().toString(36).slice(2, 9), name, lang, cards: pairs.map(([f, b]) => ({ f, b, box: 0, due: 0 })) });
const SAMPLE = [
  mk("English: 50 главных слов", "en-US", [["important", "важный"], ["to borrow", "одалживать"], ["weather", "погода"], ["although", "хотя"], ["to improve", "улучшать"], ["knowledge", "знание"], ["to explain", "объяснять"], ["enough", "достаточно"], ["to decide", "решать"], ["neighbour", "сосед"], ["behaviour", "поведение"], ["to achieve", "достигать"], ["journey", "путешествие"], ["to forget", "забывать"], ["opinion", "мнение"]]),
  mk("Столицы Европы", "", [["Польша", "Варшава"], ["Чехия", "Прага"], ["Португалия", "Лиссабон"], ["Норвегия", "Осло"], ["Венгрия", "Будапешт"], ["Румыния", "Бухарест"], ["Ирландия", "Дублин"], ["Литва", "Вильнюс"], ["Хорватия", "Загреб"], ["Финляндия", "Хельсинки"], ["Болгария", "София"], ["Словакия", "Братислава"]]),
  mk("История Украины: даты", "", [["Крещение Руси", "988"], ["Монголы взяли Киев", "1240"], ["Начало восстания Хмельницкого", "1648"], ["Переяславская рада", "1654"], ["Авария на Чернобыльской АЭС", "26 апреля 1986"], ["Акт провозглашения независимости", "24 августа 1991"], ["Принятие Конституции Украины", "28 июня 1996"]]),
  mk("Физика: формулы", "", [["Скорость", "v = s / t"], ["Плотность", "ρ = m / V"], ["Сила тяжести", "F = m·g"], ["Давление", "p = F / S"], ["Работа", "A = F·s"], ["Мощность", "N = A / t"], ["Закон Ома", "I = U / R"], ["Кинетическая энергия", "E = m·v² / 2"]]),
];
let decks = load("decks", null) || SAMPLE;
let cur = load("cur", decks[0] && decks[0].id), view = "learn", reverse = load("rev", false);
const deck = () => decks.find((d) => d.id === cur) || decks[0];
const persist = () => save("decks", decks);

// серия дней подряд
function bumpStreak() {
  const s = load("streak", { n: 0, day: "" }), today = new Date().toDateString(), y = new Date(Date.now() - DAY).toDateString();
  if (s.day !== today) { s.n = s.day === y ? s.n + 1 : 1; s.day = today; save("streak", s); }
  showStreak();
}
function showStreak() { const s = load("streak", { n: 0, day: "" }); const live = s.day === new Date().toDateString() || s.day === new Date(Date.now() - DAY).toDateString(); $("#streak").textContent = live && s.n ? `🔥 ${s.n} ${s.n % 10 === 1 && s.n % 100 !== 11 ? "день" : s.n % 10 >= 2 && s.n % 10 <= 4 && (s.n % 100 < 10 || s.n % 100 >= 20) ? "дня" : "дней"} подряд` : ""; }

function renderDecks() {
  $("#decks").innerHTML = decks.map((d) => {
    const n = d.cards.length, known = d.cards.filter((c) => c.box >= 3).length, due = d.cards.filter((c) => c.due <= Date.now()).length;
    return `<button class="deck ${d.id === deck().id ? "on" : ""}" data-id="${d.id}"><b>${esc(d.name)}</b><small>${n} карт. · выучено ${known} · к повтору ${due}</small><div class="bar"><i style="width:${n ? known / n * 100 : 0}%"></i></div></button>`;
  }).join("");
}

function render() {
  renderDecks();
  const d = deck();
  $("#title").textContent = d ? d.name : "Нет колод";
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.v === view));
  const v = $("#view"); v.innerHTML = "";
  if (!d) { v.innerHTML = `<div class="done"><div class="big">Пусто</div><p>Создай первую колоду слева.</p></div>`; return; }
  ({ learn, quiz, edit })[view](v, d);
}

const side = (c, back) => (reverse ? !back : back) ? c.b : c.f;
function speak(text, lang) { try { const u = new SpeechSynthesisUtterance(text); if (lang) u.lang = lang; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }

// ---------- Учить ----------
function learn(v, d) {
  if (!d.cards.length) { v.innerHTML = `<div class="done"><div class="big">В колоде нет карточек</div><button class="btn" id="go">Добавить карточки</button></div>`; $("#go").onclick = () => { view = "edit"; render(); }; return; }
  let queue = shuffle(d.cards.filter((c) => c.due <= Date.now()));
  let extra = false, seen = 0, right = 0;
  const start = queue.length;
  const step = () => {
    if (!queue.length) {
      const next = d.cards.reduce((m, c) => Math.min(m, c.due), Infinity), days = Math.max(1, Math.ceil((next - Date.now()) / DAY));
      v.innerHTML = `<div class="done"><div class="big">${seen ? "Готово!" : "На сегодня всё"}</div><p>${seen ? `Повторено ${seen}, с первого раза вспомнил ${right}.` : ""} Следующее повторение — через ${days} ${days === 1 ? "день" : days < 5 ? "дня" : "дней"}.</p>
        <button class="btn line" id="all">Повторить всю колоду ещё раз</button></div>`;
      $("#all").onclick = () => { queue = shuffle(d.cards.slice()); extra = true; step(); };
      renderDecks(); return;
    }
    const c = queue[0];
    v.innerHTML = `<div class="stage"><div class="card" id="card" tabindex="0" aria-label="Карточка, нажми чтобы перевернуть">
      <div class="face"><div class="txt">${esc(side(c, false))}</div>${d.lang && !reverse ? '<button class="speak" id="sp" title="Произнести">🔊</button>' : ""}<span class="hint">нажми или пробел — перевернуть</span></div>
      <div class="face back"><div class="txt">${esc(side(c, true))}</div></div></div>
      <div class="under" id="ans" hidden><button class="btn no" id="no">✗ Не помню <small>(1)</small></button><button class="btn ok" id="yes">✓ Помню <small>(2)</small></button></div>
      <div class="under" id="flipRow"><button class="btn" id="flipBtn">Показать ответ</button></div>
      <div class="meta">${extra ? "Свободное повторение" : `Осталось: ${queue.length} из ${start}`} · <label><input type="checkbox" id="rev" ${reverse ? "checked" : ""}> наоборот</label></div>
      <div class="boxes">${STEPS.map((s, i) => `<span title="ящик ${i + 1}">${s ? "+" + s + "д" : "новые"}: ${d.cards.filter((x) => x.box === i).length}</span>`).join("")}</div></div>`;
    const card = $("#card");
    const flip = () => { card.classList.add("flip"); $("#ans").hidden = false; $("#flipRow").hidden = true; };
    card.onclick = (e) => { if (e.target.id !== "sp") flip(); };
    $("#flipBtn").onclick = flip;
    if ($("#sp")) $("#sp").onclick = () => speak(c.f, d.lang);
    $("#rev").onchange = (e) => { reverse = e.target.checked; save("rev", reverse); step(); };
    const answer = (ok) => {
      queue.shift(); seen++;
      if (ok) { if (!c._miss) right++; if (!extra) { c.box = Math.min(5, c.box + 1); c.due = Date.now() + STEPS[c.box] * DAY - 3600000; } }
      else { c._miss = true; c.box = 0; c.due = 0; queue.push(c); }
      if (!queue.includes(c)) delete c._miss;
      persist(); bumpStreak(); step();
    };
    $("#yes").onclick = () => answer(true); $("#no").onclick = () => answer(false);
    keys = (e) => {
      if (e.target.matches("input,textarea")) return;
      if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); if (!card.classList.contains("flip")) flip(); }
      else if (card.classList.contains("flip") && e.key === "1") answer(false);
      else if (card.classList.contains("flip") && e.key === "2") answer(true);
    };
  };
  step();
}
let keys = null;
document.addEventListener("keydown", (e) => { if (view === "learn" && keys) keys(e); });

// ---------- Тест ----------
function quiz(v, d) {
  if (d.cards.length < 4) { v.innerHTML = `<div class="done"><div class="big">Нужно минимум 4 карточки</div><p>Добавь ещё карточек, и откроется тест.</p></div>`; return; }
  const qs = shuffle(d.cards.slice()).slice(0, 10); let i = 0, score = 0;
  const next = () => {
    if (i >= qs.length) {
      const best = load("best:" + d.id, 0); if (score > best) save("best:" + d.id, score);
      v.innerHTML = `<div class="done"><div class="big">${score} из ${qs.length}</div><p>${score === qs.length ? "Идеально! 🏆" : score >= qs.length * .7 ? "Хороший результат!" : "Повтори колоду во вкладке «Учить» и попробуй снова."} Лучший результат: ${Math.max(best, score)}.</p><button class="btn" id="again">Ещё раз</button></div>`;
      $("#again").onclick = () => quiz(v, d); bumpStreak(); return;
    }
    const c = qs[i], opts = shuffle([c, ...shuffle(d.cards.filter((x) => x !== c && side(x, true) !== side(c, true))).slice(0, 3)]);
    v.innerHTML = `<p class="meta">Вопрос ${i + 1} из ${qs.length} · верно ${score}</p><div class="q">${esc(side(c, false))}</div><div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(side(o, true))}</button>`).join("")}</div>`;
    v.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      const o = opts[+b.dataset.k], ok = o === c; if (ok) score++;
      v.querySelectorAll(".opt").forEach((x) => { x.disabled = true; if (opts[+x.dataset.k] === c) x.classList.add("good"); });
      if (!ok) b.classList.add("bad");
      i++; setTimeout(next, ok ? 600 : 1400);
    });
  };
  next();
}

// ---------- Карточки ----------
function edit(v, d) {
  v.innerHTML = `<div class="panel"><h3>Название колоды</h3><div class="row"><input type="text" id="dn" value="${esc(d.name)}"><button class="btn line" id="del">Удалить колоду</button></div>
    <p class="note" id="delAsk" hidden>Точно удалить «${esc(d.name)}»? <button class="btn no" id="delYes">Да, удалить</button> <button class="btn line" id="delNo">Нет</button></p></div>
    <div class="panel"><h3>Новая карточка</h3><div class="row"><input type="text" id="f" placeholder="Вопрос / слово"><input type="text" id="b" placeholder="Ответ / перевод"><button class="btn" id="add">Добавить</button></div></div>
    <div class="panel"><h3>Добавить списком</h3><textarea id="bulk" placeholder="apple — яблоко&#10;dog - собака&#10;Франция; Париж"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn line" id="imp">Добавить все строки</button><span class="note" style="margin:0">Разделитель: тире, точка с запятой или Tab</span></div></div>
    <div class="panel"><h3>Все карточки (${d.cards.length})</h3><div class="list" id="list"></div>
      <div class="row" style="margin-top:12px"><button class="btn line" id="reset">Сбросить прогресс</button></div></div>`;
  const list = () => { $("#list").innerHTML = d.cards.length ? d.cards.map((c, i) => `<div class="li"><span>${esc(c.f)}</span><span>${esc(c.b)}</span><span class="lv">${c.box >= 3 ? "выучено" : c.box ? "учу" : "новая"}</span><button class="x" data-i="${i}" title="Удалить" aria-label="Удалить">×</button></div>`).join("") : `<p class="note">Пока пусто — добавь первую карточку выше.</p>`; };
  list();
  $("#dn").onchange = (e) => { d.name = e.target.value.trim() || "Без названия"; persist(); render(); };
  $("#del").onclick = () => { $("#delAsk").hidden = false; };
  $("#delNo").onclick = () => { $("#delAsk").hidden = true; };
  $("#delYes").onclick = () => { decks = decks.filter((x) => x !== d); cur = decks[0] && decks[0].id; save("cur", cur); persist(); view = "learn"; render(); toast("Колода удалена"); };
  const add = () => { const f = $("#f").value.trim(), b = $("#b").value.trim(); if (!f || !b) { toast("Заполни обе стороны"); return; } d.cards.push({ f, b, box: 0, due: 0 }); persist(); $("#f").value = $("#b").value = ""; $("#f").focus(); list(); renderDecks(); };
  $("#add").onclick = add; $("#b").onkeydown = (e) => { if (e.key === "Enter") add(); };
  $("#imp").onclick = () => {
    let n = 0; $("#bulk").value.split("\n").forEach((l) => { const m = l.split(/\s+[—–-]\s+|\t|;/); if (m.length >= 2 && m[0].trim() && m[1].trim()) { d.cards.push({ f: m[0].trim(), b: m.slice(1).join(" ").trim(), box: 0, due: 0 }); n++; } });
    persist(); $("#bulk").value = ""; list(); renderDecks(); toast(n ? `Добавлено карточек: ${n}` : "Не нашёл строк вида «слово — перевод»");
  };
  $("#list").onclick = (e) => { const b = e.target.closest(".x"); if (!b) return; d.cards.splice(+b.dataset.i, 1); persist(); list(); renderDecks(); };
  $("#reset").onclick = () => { d.cards.forEach((c) => { c.box = 0; c.due = 0; }); persist(); renderDecks(); list(); toast("Прогресс сброшен"); };
}

$("#decks").onclick = (e) => { const b = e.target.closest(".deck"); if (!b) return; cur = b.dataset.id; save("cur", cur); if (view === "edit") view = "learn"; render(); };
$("#newDeck").onclick = () => { const d = mk("Новая колода", "", []); decks.push(d); cur = d.id; save("cur", cur); persist(); view = "edit"; render(); setTimeout(() => { const i = $("#dn"); if (i) { i.focus(); i.select(); } }, 30); };
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => { view = t.dataset.v; render(); });

// тема
const root = document.documentElement;
try { const t = localStorage.getItem("zub:theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => { const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("zub:theme", root.dataset.theme); } catch (e) {} };

showStreak(); render();
})();
</script>
</body>
</html>
